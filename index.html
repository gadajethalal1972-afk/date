<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a transmission for you</title>

<!-- Star Wars style fonts -->
<link href="https://fonts.cdnfonts.com/css/star-jedi" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --space: #03040b;
    --card: rgba(12, 16, 38, .82);
    --gold: #ffe81f;
    --text: #e8ecff;
    --muted: #9aa3c7;
    --blue: #4fc3ff;
    --red: #ff4d5e;
    --purple: #b36bff;
    --green: #5dff8a;
    --border: rgba(255, 255, 255, .14);
    --sw-font: "Star Jedi", "Orbitron", sans-serif;
    --body-font: "Exo 2", "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
    font-family: var(--body-font);
    color: var(--text);
    background: radial-gradient(ellipse at 50% 120%, #1a1f4d 0%, var(--space) 60%);
  }

  #space { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  /* ---------- Pages ---------- */
  .page { position: relative; z-index: 2; display: none; width: 100%; max-width: 500px; }
  .page.active { display: block; animation: warpIn .7s cubic-bezier(.2,.9,.3,1.2) both; }

  @keyframes warpIn {
    from { opacity: 0; transform: scale(.6); filter: blur(8px); }
    to   { opacity: 1; transform: scale(1); filter: blur(0); }
  }

  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 34px 26px;
    text-align: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 40px rgba(79,195,255,.15), 0 20px 60px rgba(0,0,0,.6);
    animation: hover 5s ease-in-out infinite;
  }

  .card::before {
    content: "";
    position: absolute;
    top: -2px; left: 12%; right: 12%;
    height: 3px;
    border-radius: 3px;
    background: var(--saber, var(--blue));
    box-shadow: 0 0 8px var(--saber, var(--blue)), 0 0 22px var(--saber, var(--blue));
    animation: saberHum 1.4s ease-in-out infinite alternate;
  }

  @keyframes hover { 50% { transform: translateY(-6px); } }
  @keyframes saberHum { from { opacity: .7; } to { opacity: 1; } }

  .tile {
    width: 100px; height: 100px;
    margin: 0 auto 20px;
    border-radius: 22px;
    display: grid; place-items: center;
    font-size: 3rem;
    overflow: hidden;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    animation: glowCycle 4s linear infinite;
  }

  @keyframes glowCycle {
    0%,100% { box-shadow: 0 0 22px rgba(79,195,255,.45); }
    33%     { box-shadow: 0 0 22px rgba(255,77,94,.45); }
    66%     { box-shadow: 0 0 22px rgba(179,107,255,.45); }
  }

  /* Smiling monkey */
  .tile.monkey { width: 120px; height: 120px; background: radial-gradient(circle, #2a2f5a, #12152e); padding: 6px; }
  .tile.monkey svg { animation: monkeyBob 2.2s ease-in-out infinite; }
  .tile.monkey .eye { transform-origin: center; transform-box: fill-box; animation: blink 4s infinite; }
  @keyframes monkeyBob { 50% { transform: translateY(-3px) rotate(-4deg); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

  /* ---------- Typography ---------- */
  h1, h2 {
    font-family: var(--sw-font);
    font-weight: 400;
    color: var(--gold);
    line-height: 1.35;
    letter-spacing: .03em;
    text-transform: lowercase;
    text-shadow: 0 0 14px rgba(255,232,31,.4);
  }
  h1 { font-size: 1.55rem; margin-bottom: 16px; }
  h2 { font-size: 1.3rem; margin-bottom: 10px; }

  p { line-height: 1.6; margin-bottom: 18px; }
  .sub { color: var(--muted); font-size: 1rem; margin-bottom: 20px; }
  .ps { font-style: italic; font-size: .92rem; color: var(--muted); }
  .glad-line { display: block; margin-top: 10px; font-family: var(--body-font); font-size: 1.15rem; font-weight: 700; color: var(--text); text-transform: none; letter-spacing: 0; text-shadow: none; }
  .glad-sub { color: var(--blue); font-size: 1.05rem; font-weight: 600; margin-bottom: 14px; }

  .stars-row {
    color: var(--gold);
    letter-spacing: 10px;
    margin: 6px 0 22px;
    text-shadow: 0 0 10px rgba(255,232,31,.6);
    animation: twinkle 1.6s ease-in-out infinite;
  }
  @keyframes twinkle { 50% { opacity: .5; } }

  /* ---------- Lightsaber buttons ---------- */
  .btn {
    border: 0; cursor: pointer;
    font-family: var(--sw-font);
    font-size: .95rem;
    text-transform: lowercase;
    letter-spacing: .04em;
    color: #0a0a18;
    padding: 14px 30px;
    border-radius: 999px;
    background: #fff;
    transition: transform .15s ease, box-shadow .25s ease, opacity .2s;
  }
  .btn:hover { transform: translateY(-2px) scale(1.03); }
  .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none !important; }

  .saber-red    { box-shadow: 0 0 6px #fff, 0 0 14px var(--red),    0 0 30px var(--red); }
  .saber-blue   { box-shadow: 0 0 6px #fff, 0 0 14px var(--blue),   0 0 30px var(--blue); }
  .saber-purple { box-shadow: 0 0 6px #fff, 0 0 14px var(--purple), 0 0 30px var(--purple); }
  .saber-green  { box-shadow: 0 0 6px #fff, 0 0 14px var(--green),  0 0 30px var(--green); }
  .btn-wide { width: 100%; padding: 15px; }

  .row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; min-height: 52px; }

  /* Hopping "no" button */
  #noBtn { font-size: .85rem; padding: 11px 24px; }
  #noBtn.dodging {
    position: fixed;
    z-index: 9999;
    margin: 0;
    transition: left .22s cubic-bezier(.3,1.6,.5,1), top .22s cubic-bezier(.3,1.6,.5,1);
  }

  .link {
    display: inline-block; margin-top: 14px;
    background: none; border: 0; cursor: pointer;
    font-family: var(--body-font); color: var(--muted); font-size: .9rem;
  }
  .link:hover { color: var(--text); text-decoration: underline; }

  /* ---------- Loading ---------- */
  .bar { height: 6px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; margin: 18px 0 10px; }
  .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--purple), var(--red)); box-shadow: 0 0 12px var(--blue); transition: width .12s linear; }

  /* ---------- Opening crawl ---------- */
  .crawl-wrap {
    position: relative;
    height: 70vh;
    overflow: hidden;
    perspective: 380px;
    mask-image: linear-gradient(to bottom, transparent 0%, #000 25%, #000 75%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 25%, #000 75%, transparent 100%);
  }
  .crawl {
    position: absolute;
    left: 50%;
    top: 100%;
    width: min(560px, 92vw);
    color: var(--gold);
    font-family: var(--body-font);
